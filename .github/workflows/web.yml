name: Build & Deploy (pygbag)
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo tree (debug)
        run: |
          pwd
          ls -la
          echo "---- .github/workflows ----"
          ls -la .github/workflows || true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pygbag (pin a stable version)
        run: pip install "pygbag==0.9.2"

      - name: Verify main.py exists
        run: |
          test -f main.py || (echo "ERROR: main.py not found at repo root" && exit 1)

      - name: Build web bundle
        run: |
          python -m pygbag --build --opt 2 .
          echo "---- Built files ----"
          ls -la build || true
          ls -la build/web || (echo "ERROR: build/web missing; pygbag failed" && exit 1)

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
